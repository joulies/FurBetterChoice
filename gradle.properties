# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# 1. JVM Arguments & Garbage Collection Optimization
# Increased heap allocation to 4096m with G1GC and Metaspace management for fast daemon execution.
org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# 2. Parallel Execution, Build Cache, & Configuration Cache
# Runs independent tasks in parallel and reuses cached task outputs across builds.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# 3. File System Watching
# Avoids expensive file system re-scans during build execution and sync.
org.gradle.vfs.watch=true

# 4. Kotlin Compiler Optimizations
# Enables Kotlin incremental compilation and classpath snapshotting for faster rebuilds.
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.daemon.jvmargs=-Xmx2048m -XX:+UseG1GC
kotlin.code.style=official

# 5. AndroidX & Jetifier Optimization
android.useAndroidX=true
# Disabled Jetifier as all dependencies use native AndroidX.
android.enableJetifier=false

# 6. Non-Transitive R Classes
# Avoids generating transitive resource fields across modules, accelerating compilation.
android.nonTransitiveRClass=true

# 7. Tooling Parallelism
org.gradle.tooling.parallel=true
